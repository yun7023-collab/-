<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 영단어장</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }

        .backup-icon-btn {
            background-color: #F0F4F8;
            color: #4A90E2;
            border: 1px solid #D0E1F9;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            width: auto;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #EEE;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: #888;
        }

        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #DDD;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        button:active {
            opacity: 0.8;
        }

        .day-add-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        /* 1개씩 단어 보기 카드 스타일 */
        .card-view {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            margin-top: 15px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .voca-word-large {
            font-size: 32px;
            font-weight: 800;
            color: #1E293B;
            margin-bottom: 10px;
        }

        .voca-meaning-medium {
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .voca-example-small {
            font-size: 15px;
            color: #475569;
            margin-bottom: 4px;
            font-style: italic;
        }

        .voca-exmeaning-xsmall {
            font-size: 13px;
            color: #64748B;
        }

        .card-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            gap: 10px;
        }

        .nav-btn {
            background-color: #64748B;
            flex: 1;
            padding: 10px;
        }

        .card-counter {
            font-weight: bold;
            color: #64748B;
            font-size: 14px;
        }

        .del-card-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #FF3B30;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
        }

        .quiz-card {
            text-align: center;
            padding: 20px 0;
        }

        .quiz-word {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background-color: #F0F0F0;
            color: #333;
        }

        .hidden {
            display: none !important;
        }

        .result-message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        /* 모달 팝업 스타일 */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-sizing: border-box;
            position: relative;
        }

        .close-x {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 20px; font-weight: bold;
            color: #888; cursor: pointer;
            border: none; background: none; width: auto; padding: 0;
        }

        .backup-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-green { background-color: #34C759; }
        .btn-orange { background-color: #FF9500; }
        .btn-gray { background-color: #8E8E93; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>나만의 영단어장</h1>
        <button class="backup-icon-btn" onclick="openBackupModal()">⚙️ 백업 / 복구</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('input-tab', event)">단어 등록</button>
        <button class="tab-btn" onclick="openTab('list-tab', event)">단어장 목록</button>
        <button class="tab-btn" onclick="openTab('quiz-tab', event)">연습하기</button>
    </div>

    <!-- 1. 단어 입력 탭 -->
    <div id="input-tab" class="tab-content active">
        <!-- Day 목록 추가 영역 -->
        <div class="form-group">
            <label>새 단어장(Day) 추가하기</label>
            <div class="day-add-box">
                <input type="text" id="new-day-input" placeholder="예: Day 1, 중요단어 등">
                <button type="button" onclick="addNewDay()" style="width: 100px; background-color: #34C759;">추가</button>
            </div>
        </div>

        <form id="voca-form">
            <div class="form-group">
                <label for="day-select">단어장(Day) 선택</label>
                <select id="day-select" required></select>
            </div>
            <div class="form-group">
                <label for="word">영어 단어</label>
                <input type="text" id="word" placeholder="예: name" required>
            </div>
            <div class="form-group">
                <label for="meaning">뜻</label>
                <input type="text" id="meaning" placeholder="예: 이름" required>
            </div>
            <div class="form-group">
                <label for="example">예문 (선택)</label>
                <textarea id="example" rows="2" placeholder="예: My name is Yoon."></textarea>
            </div>
            <div class="form-group">
                <label for="exmeaning">예문 뜻 (선택)</label>
                <input type="text" id="exmeaning" placeholder="예: 내 이름은 윤이에요.">
            </div>
            <button type="submit">단어 저장하기</button>
        </form>
    </div>

    <!-- 2. 단어 목록 탭 (1개씩 카드 형태로 보기) -->
    <div id="list-tab" class="tab-content">
        <div class="form-group">
            <label for="list-filter">보기 선택</label>
            <select id="list-filter" onchange="filterList()"></select>
        </div>

        <div id="card-container">
            <div id="card-display" class="card-view">
                <p style="color:#888;">등록된 단어가 없습니다.</p>
            </div>
            <div id="card-nav-bar" class="card-nav hidden">
                <button class="nav-btn" onclick="prevCard()">← 이전</button>
                <span id="card-counter" class="card-counter">0 / 0</span>
                <button class="nav-btn" onclick="nextCard()">다음 →</button>
            </div>
        </div>
    </div>

    <!-- 3. 퀴즈 연습 탭 -->
    <div id="quiz-tab" class="tab-content">
        <div class="form-group">
            <label for="quiz-filter">시험 범위 선택</label>
            <select id="quiz-filter" onchange="startQuiz()"></select>
        </div>

        <div class="form-group">
            <label for="quiz-mode">학습 모드 선택</label>
            <select id="quiz-mode" onchange="startQuiz()">
                <option value="mc">4지선다 객관식</option>
                <option value="subjective">주관식 (뜻 보고 단어 맞히기)</option>
                <option value="blank">예문 빈칸 맞히기</option>
            </select>
        </div>

        <div id="quiz-area" class="quiz-card">
            <div id="quiz-question" class="quiz-word">단어를 먼저 등록해 주세요.</div>
            <div id="quiz-options" class="options"></div>
            <div id="quiz-input-area" class="hidden" style="margin-top: 15px;">
                <input type="text" id="quiz-answer-input" placeholder="정답을 입력하세요">
                <button onclick="checkSubjectiveAnswer()" style="margin-top: 10px;">정답 제출</button>
            </div>
            <div id="quiz-result" class="result-message"></div>
            <button id="next-btn" class="hidden" onclick="nextQuestion()" style="margin-top: 15px; background-color: #8E8E93;">다음 문제</button>
        </div>
    </div>
</div>

<!-- 백업 / 복구 모달 팝업 -->
<div id="backup-modal" class="modal hidden" onclick="closeModalOnBg(event)">
    <div class="modal-content">
        <button class="close-x" onclick="closeBackupModal()">✕</button>
        <h3 style="margin-top:0; color:var(--primary-color);">📱 백업 및 복구</h3>
        <p style="font-size:13px; color:#666; line-height:1.4;">
            단어 데이터를 백업 파일로 저장하거나 불러올 수 있습니다.
        </p>

        <div class="backup-btn-group">
            <button class="btn-green" onclick="exportData()">📁 파일로 백업하기</button>
            <button class="btn-orange" onclick="document.getElementById('import-file').click()">📂 파일로 복구하기</button>
            <button class="btn-gray" onclick="closeBackupModal()">닫기</button>
        </div>
        <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
    </div>
</div>

<script>
    let vocaData = [];
    let dayList = ["Day 1"];
    let currentFilteredList = [];
    let currentCardIndex = 0;
    let currentCorrectAnswer = "";

    window.onload = function() {
        vocaData = JSON.parse(localStorage.getItem('myVocaData_guest')) || [];
        dayList = JSON.parse(localStorage.getItem('myVocaDays_guest')) || ["Day 1"];
        updateDaySelects();
    };

    function saveData() {
        localStorage.setItem('myVocaData_guest', JSON.stringify(vocaData));
        localStorage.setItem('myVocaDays_guest', JSON.stringify(dayList));
    }

    function addNewDay() {
        const input = document.getElementById('new-day-input');
        const newDay = input.value.trim();
        if (!newDay) {
            alert('단어장 이름을 입력해 주세요.');
            return;
        }
        if (dayList.includes(newDay)) {
            alert('이미 존재하는 단어장입니다.');
            return;
        }
        dayList.push(newDay);
        saveData();
        updateDaySelects();
        input.value = '';
        alert(`'${newDay}' 단어장이 추가되었습니다.`);
    }

    function updateDaySelects() {
        const daySelect = document.getElementById('day-select');
        const listFilter = document.getElementById('list-filter');
        const quizFilter = document.getElementById('quiz-filter');

        daySelect.innerHTML = dayList.map(d => `<option value="${d}">${d}</option>`).join('');

        const filterOptions = `<option value="all">전체 보기</option>` + dayList.map(d => `<option value="${d}">${d}</option>`).join('');
        listFilter.innerHTML = filterOptions;

        const quizFilterOptions = `<option value="all">전체 시험</option>` + dayList.map(d => `<option value="${d}">${d}</option>`).join('');
        quizFilter.innerHTML = quizFilterOptions;
    }

    function openTab(tabId, e) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if(e && e.target) e.target.classList.add('active');

        if (tabId === 'list-tab') filterList();
        if (tabId === 'quiz-tab') startQuiz();
    }

    document.getElementById('voca-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const day = document.getElementById('day-select').value;
        const word = document.getElementById('word').value.trim();
        const meaning = document.getElementById('meaning').value.trim();
        const example = document.getElementById('example').value.trim();
        const exmeaning = document.getElementById('exmeaning').value.trim();

        vocaData.push({ id: Date.now(), day, word, meaning, example, exmeaning });
        saveData();

        alert('단어가 저장되었습니다!');
        this.reset();
    });

    // 카드형 목록 로직
    function filterList() {
        const selected = document.getElementById('list-filter').value;
        if (selected === 'all') {
            currentFilteredList = [...vocaData];
        } else {
            currentFilteredList = vocaData.filter(item => item.day === selected);
        }
        currentCardIndex = 0;
        renderCard();
    }

    function renderCard() {
        const cardDisplay = document.getElementById('card-display');
        const navBar = document.getElementById('card-nav-bar');
        const counter = document.getElementById('card-counter');

        if (currentFilteredList.length === 0) {
            cardDisplay.innerHTML = `<p style="color:#888;">등록된 단어가 없습니다.</p>`;
            navBar.classList.add('hidden');
            return;
        }

        navBar.classList.remove('hidden');
        const item = currentFilteredList[currentCardIndex];
        counter.innerText = `${currentCardIndex + 1} / ${currentFilteredList.length}`;

        cardDisplay.innerHTML = `
            <button class="del-card-btn" onclick="deleteWord(${item.id})">삭제</button>
            <div class="voca-word-large">${item.word}</div>
            <div class="voca-meaning-medium">${item.meaning}</div>
            ${item.example ? `<div class="voca-example-small">${item.example}</div>` : ''}
            ${item.exmeaning ? `<div class="voca-exmeaning-xsmall">${item.exmeaning}</div>` : ''}
        `;
    }

    function prevCard() {
        if (currentFilteredList.length === 0) return;
        currentCardIndex = (currentCardIndex - 1 + currentFilteredList.length) % currentFilteredList.length;
        renderCard();
    }

    function nextCard() {
        if (currentFilteredList.length === 0) return;
        currentCardIndex = (currentCardIndex + 1) % currentFilteredList.length;
        renderCard();
    }

    function deleteWord(id) {
        if(!confirm('이 단어를 삭제하시겠습니까?')) return;
        vocaData = vocaData.filter(item => item.id !== id);
        saveData();
        filterList();
    }

    // 백업/복구 모달
    function openBackupModal() { document.getElementById('backup-modal').classList.remove('hidden'); }
    function closeBackupModal() { document.getElementById('backup-modal').classList.add('hidden'); }
    function closeModalOnBg(e) { if(e.target.id === 'backup-modal') closeBackupModal(); }

    function exportData() {
        if (vocaData.length === 0) {
            alert('내보낼 단어 데이터가 없습니다.');
            return;
        }
        const exportObj = { vocaData, dayList };
        const blob = new Blob([JSON.stringify(exportObj, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `voca_backup.json`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 100);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedObj = JSON.parse(e.target.result);
                if (Array.isArray(importedObj)) {
                    vocaData = importedObj;
                } else if (importedObj.vocaData) {
                    vocaData = importedObj.vocaData || [];
                    dayList = importedObj.dayList || ["Day 1"];
                }
                saveData();
                updateDaySelects();
                alert('단어장을 성공적으로 불러왔습니다!');
                closeBackupModal();
                filterList();
            } catch (err) {
                alert('파일을 읽는 중 오류가 발생했습니다.');
            }
        };
        reader.readAsText(file);
    }

    // 퀴즈 로직
    function startQuiz() {
        const filter = document.getElementById('quiz-filter').value;
        let quizList = vocaData;
        if (filter !== 'all') {
            quizList = vocaData.filter(item => item.day === filter);
        }

        if (quizList.length === 0) {
            document.getElementById('quiz-question').innerText = "해당 단어장에 등록된 단어가 없습니다.";
            document.getElementById('quiz-options').innerHTML = "";
            document.getElementById('quiz-input-area').classList.add('hidden');
            return;
        }
        nextQuestionWithList(quizList);
    }

    function nextQuestion() {
        startQuiz();
    }

    function nextQuestionWithList(quizList) {
        document.getElementById('quiz-result').innerText = "";
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('quiz-answer-input').value = "";

        const mode = document.getElementById('quiz-mode').value;
        const currentItem = quizList[Math.floor(Math.random() * quizList.length)];

        const questionEl = document.getElementById('quiz-question');
        const optionsEl = document.getElementById('quiz-options');
        const inputAreaEl = document.getElementById('quiz-input-area');

        optionsEl.innerHTML = "";
        inputAreaEl.classList.add('hidden');

        if (mode === 'mc') {
            questionEl.innerText = currentItem.word;
            currentCorrectAnswer = currentItem.meaning;

            let choices = [currentItem.meaning];
            while (choices.length < Math.min(4, quizList.length)) {
                let randomMeaning = quizList[Math.floor(Math.random() * quizList.length)].meaning;
                if (!choices.includes(randomMeaning)) choices.push(randomMeaning);
            }
            choices.sort(() => Math.random() - 0.5);

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkMCAnswer(choice);
                optionsEl.appendChild(btn);
            });
        } else if (mode === 'subjective') {
            questionEl.innerText = `뜻: ${currentItem.meaning}`;
            currentCorrectAnswer = currentItem.word.toLowerCase();
            inputAreaEl.classList.remove('hidden');
        } else if (mode === 'blank') {
            if (!currentItem.example || !currentItem.example.toLowerCase().includes(currentItem.word.toLowerCase())) {
                startQuiz();
                return;
            }
            const regex = new RegExp(currentItem.word, 'gi');
            const blankExample = currentItem.example.replace(regex, '_____');
            questionEl.innerText = blankExample;
            currentCorrectAnswer = currentItem.word.toLowerCase();
            inputAreaEl.classList.remove('hidden');
        }
    }

    function checkMCAnswer(selected) {
        const resultEl = document.getElementById('quiz-result');
        if (selected === currentCorrectAnswer) {
            resultEl.innerText = "⭕ 정답입니다!";
            resultEl.style.color = "green";
        } else {
            resultEl.innerText = `❌ 오답입니다. (정답: ${currentCorrectAnswer})`;
            resultEl.style.color = "red";
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function checkSubjectiveAnswer() {
        const userInput = document.getElementById('quiz-answer-input').value.trim().toLowerCase();
        const resultEl = document.getElementById('quiz-result');
        if (userInput === currentCorrectAnswer) {
            resultEl.innerText = "⭕ 정답입니다!";
            resultEl.style.color = "green";
        } else {
            resultEl.innerText = `❌ 오답입니다. (정답: ${currentCorrectAnswer})`;
            resultEl.style.color = "red";
        }
        document.getElementById('next-btn').classList.remove('hidden');
    }
</script>

</body>
</html>
